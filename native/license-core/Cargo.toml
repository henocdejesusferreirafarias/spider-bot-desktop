[package]
name = "license-core"
version = "0.1.0"
edition = "2021"
description = "Nucleo nativo de licenciamento do Spider BOT (verificacao EdDSA + fingerprint de hardware)."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Node-API e ABI-estavel: o .node funciona em Node/Electron sem electron-rebuild.
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
# Verificacao Ed25519 (EdDSA) com suporte a chave publica em PEM (SPKI/pkcs8).
ed25519-dalek = { version = "2", features = ["pem", "rand_core"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Frente B: decifragem dos payloads servidos (envelope X25519 -> HKDF -> AES-256-GCM).
# A chave X25519 do device e DERIVADA do hardware (StaticSecret), nunca persistida.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
aes-gcm = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.48", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory"
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
opt-level = "z"
